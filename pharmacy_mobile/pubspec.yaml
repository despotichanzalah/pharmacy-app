name: pharmacy_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Used to talk to the pharmacy backend API
  http: ^1.2.0
  # Used to store the login token on the device
  shared_preferences: ^2.2.2
  # Used to build and print/share the sale receipt
  pdf: ^3.11.1
  printing: ^5.13.4
  # Used for the Overview dashboard's charts
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
