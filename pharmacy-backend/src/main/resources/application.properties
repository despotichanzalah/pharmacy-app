spring.application.name=pharmacy-backend

# In production (Render), set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables
# in the dashboard. Locally, these fall back to your local Postgres setup.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pharmacy_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:678678}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT — in production, set JWT_SECRET as an environment variable to a long random string.
jwt.secret=${JWT_SECRET:change_this_to_a_long_random_secret_key_before_production_use}
jwt.expiration-ms=86400000

# Render sets PORT automatically; locally this falls back to 8080.
server.port=${PORT:8080}
