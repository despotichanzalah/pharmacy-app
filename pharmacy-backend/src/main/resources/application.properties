spring.application.name=pharmacy-backend

# In production (Render), set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables
# in the dashboard. Locally, these fall back to your local Postgres setup.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/pharmacy_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:678678}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT — in production, set JWT_SECRET as an environment variable to a long random string.
jwt.secret=${JWT_SECRET:change_this_to_a_long_random_secret_key_before_production_use}
jwt.expiration-ms=86400000

# Used to build links inside emails (password reset, etc.)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Google Sign-In — from Google Cloud Console (must match the frontend's client ID).
google.client-id=${GOOGLE_CLIENT_ID:}

# Email — using Brevo's HTTPS API (SMTP ports are blocked on many free hosts, HTTPS never is).
brevo.api-key=${BREVO_API_KEY:}

# The verified "from" address emails will appear to come from (set up in Brevo's Senders page).
app.mail-from=${MAIL_FROM:}

# Render sets PORT automatically; locally this falls back to 8080.
server.port=${PORT:8080}